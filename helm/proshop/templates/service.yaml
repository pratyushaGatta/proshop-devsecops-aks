apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-proshop-service
  labels:
    app: proshop
spec:
  type: {{ .Values.service.type }}
  selector:
    app: proshop
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP